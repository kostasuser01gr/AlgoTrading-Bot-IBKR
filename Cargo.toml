[workspace]
resolver = "2"
members = [
  "crates/operator-core",
  "services/orchestrator",
  "services/model-router",
  "services/risk-engine",
  "services/data-ingestion",
  "services/execution",
  "services/backtest",
  "services/alerts"
]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
async-trait = "0.1.89"
axum = { version = "0.8.9", features = ["macros"] }
chrono = { version = "0.4.42", features = ["clock", "serde"] }
operator-core = { path = "crates/operator-core" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10"
thiserror = "2.0.17"
tokio = { version = "1.52.3", features = ["full"] }
tower-http = { version = "0.6.10", features = ["trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
url = { version = "2.5.7", features = ["serde"] }
uuid = { version = "1.23.2", features = ["serde", "v4"] }

